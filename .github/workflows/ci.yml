name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.21

      - name: Sync exact lockfile
        run: uv sync --locked --extra dev

      - name: Dependency consistency
        run: uv pip check

      - name: Known-vulnerability audit
        run: uv run --locked pip-audit --progress-spinner off

      - name: Compile
        run: uv run --locked python -m compileall -q src tests scripts

      - name: Lint
        run: uv run --locked ruff check src tests scripts

      - name: Typecheck
        run: uv run --locked mypy src tests scripts

      - name: Scan worktree and git history for secrets
        run: uv run --locked python scripts/check_secrets.py

      - name: Test
        run: uv run --locked pytest -q

      - name: LiveKit import smoke test
        run: >-
          uv run --locked python -c "import agent; print('livekit-agent-import: OK')"

      - name: Build production image
        run: docker build --tag velts-bad-ci .

      - name: Runtime image import smoke test
        run: >-
          docker run --rm --entrypoint /app/.venv/bin/python
          velts-bad-ci -c "import agent; print('container-import: OK')"
