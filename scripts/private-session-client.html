<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src https://cdn.jsdelivr.net; connect-src wss: ws: https:; style-src 'unsafe-inline'; media-src 'self' blob:; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Velts-Bad Private Voice Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; background: #111; color: #eee; }
    .card { border: 1px solid #444; border-radius: 12px; padding: 20px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px; background: #1d1d1d; color: #fff; border: 1px solid #555; border-radius: 8px; }
    button { margin-top: 16px; margin-right: 8px; padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer; }
    #status { margin-top: 18px; white-space: pre-wrap; }
    .ok { color: #8ee58e; }
    .error { color: #ff8b8b; }
    .muted { color: #aaa; }
    audio { width: 100%; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Velts-Bad private voice test</h1>
  <div class="card">
    <p class="muted">This client connects directly to the deployed LiveKit room. It requests microphone access only. Camera access is never requested.</p>

    <label for="server">LiveKit URL</label>
    <input id="server" type="text" readonly>

    <label for="roomName">Room</label>
    <input id="roomName" type="text" readonly>

    <label for="token">Temporary token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Paste token here">

    <button id="connect">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <button id="clearClipboard">Clear clipboard</button>

    <div id="status" class="muted">Waiting for token.</div>
    <div id="remoteAudio"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.21.0/dist/livekit-client.umd.min.js"></script>
  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const serverInput = document.getElementById('server');
      const roomInput = document.getElementById('roomName');
      const tokenInput = document.getElementById('token');
      const connectButton = document.getElementById('connect');
      const disconnectButton = document.getElementById('disconnect');
      const clearClipboardButton = document.getElementById('clearClipboard');
      const status = document.getElementById('status');
      const remoteAudio = document.getElementById('remoteAudio');

      serverInput.value = params.get('server') || '';
      roomInput.value = params.get('room') || '';

      let room = null;

      function setStatus(message, kind) {
        status.textContent = message;
        status.className = kind || 'muted';
      }

      async function overwriteClipboard() {
        try {
          await navigator.clipboard.writeText('[cleared]');
          return true;
        } catch (_) {
          return false;
        }
      }

      clearClipboardButton.addEventListener('click', async () => {
        const cleared = await overwriteClipboard();
        setStatus(cleared ? 'Clipboard overwritten.' : 'Browser could not overwrite clipboard. Use PowerShell: Set-Clipboard -Value \'[cleared]\'', cleared ? 'ok' : 'error');
      });

      connectButton.addEventListener('click', async () => {
        const serverUrl = serverInput.value.trim();
        const token = tokenInput.value.trim();

        if (!serverUrl.startsWith('wss://')) {
          setStatus('Invalid LiveKit URL.', 'error');
          return;
        }
        if (!token) {
          setStatus('Paste the temporary token first.', 'error');
          return;
        }

        connectButton.disabled = true;
        setStatus('Connecting...', 'muted');

        try {
          const { Room, RoomEvent, Track } = LivekitClient;
          room = new Room();

          room.on(RoomEvent.TrackSubscribed, (track) => {
            if (track.kind !== Track.Kind.Audio) return;
            const element = track.attach();
            element.autoplay = true;
            element.controls = true;
            remoteAudio.replaceChildren(element);
            setStatus('Connected. Remote agent audio subscribed. Speak now.', 'ok');
          });

          room.on(RoomEvent.Disconnected, () => {
            connectButton.disabled = false;
            disconnectButton.disabled = true;
            setStatus('Disconnected.', 'muted');
          });

          await room.connect(serverUrl, token, { autoSubscribe: true });
          tokenInput.value = '';
          await overwriteClipboard();
          await room.startAudio();
          await room.localParticipant.setMicrophoneEnabled(true);

          disconnectButton.disabled = false;
          setStatus('Connected. Microphone published. Waiting for agent audio...', 'ok');
        } catch (error) {
          connectButton.disabled = false;
          disconnectButton.disabled = true;
          if (room) {
            try { await room.disconnect(); } catch (_) {}
          }
          room = null;
          setStatus('Connection failed: ' + (error && error.message ? error.message : String(error)), 'error');
        }
      });

      disconnectButton.addEventListener('click', async () => {
        if (!room) return;
        try {
          await room.localParticipant.setMicrophoneEnabled(false);
        } catch (_) {}
        await room.disconnect();
        room = null;
      });
    })();
  </script>
</body>
</html>
