<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src wss: ws: https:; style-src 'unsafe-inline'; media-src 'self' blob:; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Teste Privado de Voz Velts-Bad</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; background: #111; color: #eee; }
    .card { border: 1px solid #444; border-radius: 12px; padding: 20px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px; background: #1d1d1d; color: #fff; border: 1px solid #555; border-radius: 8px; }
    button { margin-top: 16px; margin-right: 8px; padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer; }
    #status { margin-top: 18px; white-space: pre-wrap; }
    .ok { color: #8ee58e; }
    .error { color: #ff8b8b; }
    .muted { color: #aaa; }
    audio { width: 100%; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Teste de voz privado Velts-Bad</h1>
  <div class="card">
    <p class="muted">A pagina usa apenas o microfone. Camera nunca e solicitada. O token temporario e lido automaticamente do clipboard ao clicar em Conectar.</p>

    <label for="server">LiveKit URL</label>
    <input id="server" type="text" readonly>

    <label for="roomName">Sala</label>
    <input id="roomName" type="text" readonly>

    <div id="tokenFallback" hidden>
      <label for="token">Token temporario (fallback)</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Cole o token aqui somente se o navegador bloquear o clipboard">
    </div>

    <button id="connect">Conectar</button>
    <button id="disconnect" disabled>Desconectar</button>

    <div id="status" class="muted">Pronto para conectar.</div>
    <div id="remoteAudio"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.21.0/dist/livekit-client.umd.min.js"></script>
  <script src="/private-session-client.js"></script>
</body>
</html>
